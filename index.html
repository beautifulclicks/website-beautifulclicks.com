<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLC Properties</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f2eb;
        --ink: #1f2328;
        --muted: #6b7280;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100vw, 1080px);
        padding: 64px 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 5vw, 58px);
        letter-spacing: -0.02em;
        text-align: center;
      }

      .sub {
        margin: 0 0 40px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.5;
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .tile {
        min-height: 220px;
        background: #fff;
        border: 1px solid rgba(31, 35, 40, 0.08);
        border-radius: 14px;
        display: grid;
        place-items: center;
        text-decoration: none;
        color: var(--ink);
        box-shadow: 0 10px 30px rgba(31, 35, 40, 0.05);
        transition: transform 160ms ease, box-shadow 160ms ease;
        padding: 18px;
        text-align: center;
      }

      .tile > div {
        width: 100%;
        display: grid;
        justify-items: center;
      }

      .tile:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 40px rgba(31, 35, 40, 0.08);
      }

      .tile-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 8px;
        text-align: center;
      }

      .tile-copy {
        margin: 0;
        color: var(--muted);
        line-height: 1.4;
        text-align: center;
      }

      .tile-wide {
        grid-column: span 1;
      }

      .tile-img {
        width: min(78%, 170px);
        height: auto;
        display: block;
        margin: 0 auto 14px;
      }

      @media (max-width: 840px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CLC Properties</h1>
      <p class="sub">Simple demo board for the first website conversation.</p>

      <div class="grid">
        <a class="tile tile-wide" href="logo.html">
          <div>
            <img class="tile-img" src="assets/logo-current.png" alt="CLC Properties logo">
            <div class="tile-title">Logo</div>
            <p class="tile-copy">Current mark, cleaner mark, and early rebranding ideas.</p>
          </div>
        </a>

        <a class="tile tile-wide" href="website.html">
          <div>
            <div class="tile-title">Front-Facing Website</div>
            <p class="tile-copy">Quick mockup ideas for the public site and feel of the brand.</p>
          </div>
        </a>

        <a class="tile tile-wide" href="deck.html">
          <div>
            <div class="tile-title">Meeting Deck</div>
            <p class="tile-copy">Live talking points for the screen-share meeting.</p>
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
