<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLC Properties - Feedback Sent</title>
    <style>
      :root { color-scheme: light; --bg: #f5f2eb; --ink: #1f2328; --muted: #6b7280; --line: rgba(31, 35, 40, 0.1); }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; }
      main { width: min(100vw, 720px); padding: 48px 24px; text-align: center; }
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 36px; box-shadow: 0 10px 30px rgba(31, 35, 40, 0.05); }
      h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 52px); }
      p { margin: 0 0 24px; color: var(--muted); font-size: 18px; line-height: 1.5; }
      a { display: inline-flex; align-items: center; min-height: 44px; border-radius: 999px; background: var(--ink); color: #fff; padding: 0 18px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Feedback Sent</h1>
        <p>That comment has been submitted to the preview site.</p>
        <a href="/logo.html">Back to logo concepts</a>
      </section>
    </main>
  </body>
</html>
